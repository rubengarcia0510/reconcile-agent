spring.application.name=reconcile-agent
spring.mongodb.uri=mongodb://localhost:27017/reconcile
spring.data.mongodb.representation.big-decimal=DECIMAL128
management.endpoints.web.exposure.include=health
vultr.inference.base-url=${VULTR_INFERENCE_BASE_URL:https://api.vultrinference.com/v1}
vultr.inference.api-key=${VULTR_INFERENCE_API_KEY:}
vultr.inference.model=${VULTR_INFERENCE_MODEL:qwen3.8-27b}
vultr.inference.max-tokens=4000
